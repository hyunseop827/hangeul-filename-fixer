# Checks every push to main and every pull request: release readiness (version, release notes), type check, tests,
# and the real DMG, packaged and inspected. On main, a passing run then calls release.yml, which releases the version
# in package.json if it is new (see there).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's run, but never a run on main (its release job may be half way).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: 검사, 테스트, DMG
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃 (태그 포함)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # The same decision the release job makes, without publishing: a missing version bump, a stale
      # .github/release-notes.md header or a lockfile out of step fails here, before the merge.
      - name: 버전과 릴리스 노트 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs --check

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: DMG 만들기 (빌드 포함)
        run: npm run dist

      - name: DMG 확인
        run: |
          version="$(node -p "require('./package.json').version")"
          scripts/verify-dmg.sh "release/hangeul-filename-fixer-$version.dmg" "$version"

  release:
    name: 릴리스
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
