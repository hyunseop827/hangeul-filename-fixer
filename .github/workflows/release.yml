# Actions 탭 → Release → Run workflow 로 실행합니다.
# 버전을 올리고 CHANGELOG의 [Unreleased]를 그 버전으로 바꾼 뒤, DMG를 빌드해서
# 커밋·태그를 main에 올리고 GitHub Release를 만듭니다.
# "시험 실행"을 켜면 DMG만 만들어 워크플로 결과물(Artifacts)로 올리고 아무것도 커밋하거나 배포하지 않습니다.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 버전 (patch 1.0.0→1.0.1, minor →1.1.0, major →2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: "시험 실행 (커밋·태그·릴리스 없이 DMG만 만들기)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No dependency cache here: a release build should not restore caches other workflows wrote.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Bump version and CHANGELOG
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          node scripts/release-changelog.mjs prepare "$VERSION" "$(TZ=Asia/Seoul date +%F)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: npm run dist

      - name: Checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          shasum -a 256 "hangeul-filename-fixer-$VERSION.dmg" | tee "hangeul-filename-fixer-$VERSION.dmg.sha256"

      - name: Upload DMG (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: hangeul-filename-fixer-${{ steps.version.outputs.version }}-dry-run
          path: |
            release/hangeul-filename-fixer-${{ steps.version.outputs.version }}.dmg
            release/hangeul-filename-fixer-${{ steps.version.outputs.version }}.dmg.sha256
            CHANGELOG.md
          retention-days: 7

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-changelog.mjs notes "$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            "release/hangeul-filename-fixer-$VERSION.dmg" \
            "release/hangeul-filename-fixer-$VERSION.dmg.sha256" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
